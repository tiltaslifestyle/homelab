---
- name: Generate KeyPair and Keystore for {{ broker.name }}
  ansible.builtin.command: >
    keytool -keystore {{ kafka_pki_dir }}/{{ broker.name }}.keystore.jks
    -alias {{ broker.name }} -validity {{ kafka_cert_validity_days }}
    -genkey -keyalg RSA -ext SAN=dns:{{ broker.name }},ip:{{ broker.ip }},ip:127.0.0.1
    -dname "CN={{ broker.name }},OU=DevOps,O=Homelab,L=Warsaw,C=PL"
    -storepass {{ kafka_cert_pass }}
    -keypass {{ kafka_cert_pass }}
  args:
    creates: "{{ kafka_pki_dir }}/{{ broker.name }}.keystore.jks"
  no_log: true

- name: Export CSR for {{ broker.name }}
  ansible.builtin.command: >
    keytool -keystore {{ kafka_pki_dir }}/{{ broker.name }}.keystore.jks
    -alias {{ broker.name }} -certreq -file {{ kafka_pki_dir }}/{{ broker.name }}.csr
    -storepass {{ kafka_cert_pass }}
  args:
    creates: "{{ kafka_pki_dir }}/{{ broker.name }}.csr"
  no_log: true

- name: Write SAN extension file for {{ broker.name }}
  ansible.builtin.copy:
    dest: "{{ kafka_pki_dir }}/{{ broker.name }}.ext"
    content: "subjectAltName=DNS:{{ broker.name }},IP:{{ broker.ip }},IP:127.0.0.1\n"
    mode: '0600'

- name: Sign CSR with Root CA for {{ broker.name }}
  ansible.builtin.command: >
    openssl x509 -req -CA {{ kafka_pki_dir }}/ca-cert
    -CAkey {{ kafka_pki_dir }}/ca-key
    -in {{ kafka_pki_dir }}/{{ broker.name }}.csr
    -out {{ kafka_pki_dir }}/{{ broker.name }}-signed.crt
    -days {{ kafka_cert_validity_days }} -CAcreateserial
    -extfile {{ kafka_pki_dir }}/{{ broker.name }}.ext
  args:
    creates: "{{ kafka_pki_dir }}/{{ broker.name }}-signed.crt"

- name: Import CA into Broker Keystore for {{ broker.name }}
  ansible.builtin.command: >
    keytool -keystore {{ kafka_pki_dir }}/{{ broker.name }}.keystore.jks
    -alias CARoot -import -noprompt -file {{ kafka_pki_dir }}/ca-cert
    -storepass {{ kafka_cert_pass }}
  register: kafka_import_ca_result
  changed_when: "'Certificate was added to keystore' in kafka_import_ca_result.stdout"
  failed_when: >
    kafka_import_ca_result.rc != 0 and
    'already exists' not in (kafka_import_ca_result.stdout + kafka_import_ca_result.stderr)
  no_log: true

- name: Import Signed Cert into Broker Keystore for {{ broker.name }}
  ansible.builtin.command: >
    keytool -keystore {{ kafka_pki_dir }}/{{ broker.name }}.keystore.jks
    -alias {{ broker.name }} -import -noprompt -file {{ kafka_pki_dir }}/{{ broker.name }}-signed.crt
    -storepass {{ kafka_cert_pass }}
    -keypass {{ kafka_cert_pass }}
  register: kafka_import_cert_result
  changed_when: "'Certificate reply was installed in keystore' in kafka_import_cert_result.stdout"
  failed_when: >
    kafka_import_cert_result.rc != 0 and
    'already exists' not in (kafka_import_cert_result.stdout + kafka_import_cert_result.stderr) and
    'are identical' not in (kafka_import_cert_result.stdout + kafka_import_cert_result.stderr)
  no_log: true

- name: Restrict permissions on keystore and CSR artifacts for {{ broker.name }}
  ansible.builtin.file:
    path: "{{ item }}"
    mode: '0600'
  loop:
    - "{{ kafka_pki_dir }}/{{ broker.name }}.keystore.jks"
    - "{{ kafka_pki_dir }}/{{ broker.name }}.csr"
    - "{{ kafka_pki_dir }}/{{ broker.name }}-signed.crt"
