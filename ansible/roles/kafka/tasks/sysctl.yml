---
- name: Set kernel memory & map limits for Kafka
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
  loop:
    - { key: 'vm.swappiness', value: '1' }
    - { key: 'vm.max_map_count', value: '262144' }

- name: Increase open files limit (ulimit -n)
  community.general.pam_limits:
    domain: '*'
    limit_type: "{{ item.type }}"
    limit_item: nofile
    value: '65536'
  loop:
    - { type: 'soft' }
    - { type: 'hard' }
