esphome:
  name: ble-gateway
  friendly_name: BLE Gateway Hub
  platformio_options:
      board_build.partitions: min_spiffs.csv

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: !secret ble_gateway_ip

  ap:
    ssid: "BLE-Gateway-Fallback"
    password: !secret fallback_password

captive_portal:

esp32_ble_tracker:

bluetooth_proxy:
  active: true
