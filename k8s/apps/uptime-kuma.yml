apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: uptime-kuma
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://dirsigler.github.io/uptime-kuma-helm
    chart: uptime-kuma
    targetRevision: 4.0.0
    helm:
      releaseName: uptime-kuma
      values: |
        replicaCount: 1
        service:
          type: ClusterIP
          port: 3001
        ingress:
          enabled: true
          hosts:
            - host: uptime-kuma.lan
              paths:
                - path: /
                  pathType: Prefix
        resources:
          limits:
            cpu: 100m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        volume:
          enabled: true
          accessMode: ReadWriteOnce
          size: 4Gi
  destination:
    server: "https://kubernetes.default.svc"
    namespace: uptime-kuma
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
