apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-dashboard-minimal
  namespace: home-assistant
data:
  minimal.yaml: |
    views:
      - title: Home
        path: home
        icon: mdi:home-outline
        type: sections
        badges:
          - type: custom:mushroom-chips-card
            chips:
              - type: weather
                entity: weather.home
                show_temperature: true
                show_conditions: true
              - type: template
                icon: mdi:lightbulb-on-outline
                icon_color: amber
                content: "{{ states.light | selectattr('state', 'eq', 'on') | list | count }} on"
              - type: entity
                entity: lock.front_door
                icon_color: green
              - type: entity
                entity: person.admin
                icon_color: blue
        sections:
          - title: Quick Scenes
            cards:
              - type: custom:mushroom-chips-card
                alignment: center
                chips:
                  - type: action
                    icon: mdi:weather-sunset-up
                    icon_color: amber
                    action_name: Morning
                    tap_action:
                      action: call-service
                      service: scene.turn_on
                      target:
                        entity_id: scene.morning
                  - type: action
                    icon: mdi:movie-open
                    icon_color: purple
                    action_name: Movie
                    tap_action:
                      action: call-service
                      service: scene.turn_on
                      target:
                        entity_id: scene.movie
                  - type: action
                    icon: mdi:moon-waning-crescent
                    icon_color: indigo
                    action_name: Night
                    tap_action:
                      action: call-service
                      service: scene.turn_on
                      target:
                        entity_id: scene.night
                  - type: action
                    icon: mdi:door-closed-lock
                    icon_color: red
                    action_name: Away
                    tap_action:
                      action: call-service
                      service: scene.turn_on
                      target:
                        entity_id: scene.away

          - title: Living Room
            cards:
              - type: custom:mushroom-light-card
                entity: light.living_room_lights
                name: Ceiling Lights
                icon: mdi:ceiling-light
                show_brightness_control: true
                show_color_temp_control: true
                use_light_color: true
                layout: horizontal

              - type: custom:mushroom-climate-card
                entity: climate.living_room_thermostat
                name: Climate
                hvac_modes:
                  - heat
                  - cool
                  - "off"
                show_temperature_control: true
                layout: horizontal

          - title: Bedroom
            cards:
              - type: custom:mushroom-light-card
                entity: light.bedroom_lights
                name: Bedroom Lights
                icon: mdi:bed-double-outline
                show_brightness_control: true
                show_color_temp_control: true
                use_light_color: true
                layout: horizontal

          - title: Media & Sound
            cards:
              - type: custom:mushroom-media-player-card
                entity: media_player.living_room_speaker
                name: Speaker
                icon: mdi:speaker
                show_volume_level: true
                volume_controls:
                  - volume_buttons
                  - volume_set
                layout: horizontal

          - title: Homelab Node
            cards:
              - type: custom:mushroom-template-card
                primary: Lenovo ThinkPad L480
                secondary: "Cluster Node • Battery UPS"
                icon: mdi:server
                icon_color: green
                layout: horizontal
